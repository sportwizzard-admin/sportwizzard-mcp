name: Publish SportWizzard MCP image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: read

concurrency:
  group: sportwizzard-mcp-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sportwizzard-ci]
    timeout-minutes: 20
    steps:
      - name: Check out the exact approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Look for a passing pull-request check of this exact tree
        id: pr_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/pr-check-evidence.sh ci.yml "$GITHUB_SHA"

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container

      - name: Assemble tracked source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/image-source"

      - name: Authenticate the image publisher
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable image and release identity
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          PR_RUN: ${{ steps.pr_check.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY}
          cache_ref="$image:buildcache-container"
          metadata="$RUNNER_TEMP/image-metadata.json"
          docker buildx build --builder "$BUILDER_NAME" --platform linux/amd64 \
            --cache-from "type=registry,ref=$cache_ref" \
            --cache-to "type=registry,ref=$cache_ref,mode=max,ignore-error=true" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" \
            --metadata-file "$metadata" --push "$RUNNER_TEMP/image-source"
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")"
          receipt_dir="$RUNNER_TEMP/release-receipt"
          receipt="$receipt_dir/release-receipt.json"
          mkdir -p "$receipt_dir"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" \
            --arg publisher publish-container.yml \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$image@$digest" --arg pr_run "$PR_RUN" \
            '{schema:"sportwizzard.release-receipt/v1",repository:$repository,revision:$revision,publisher:$publisher,run_id:$run_id,run_attempt:$run_attempt,images:{sha:$sha},
              checks:(if $pr_run == "" then {} else {"pr-check": "passed (run \($pr_run))"} end)}' \
            > "$receipt"
          jq -e '(.revision | test("^[0-9a-f]{40}$")) and (.images | length > 0) and all(.images[]; test("^ghcr\\.io/[a-z0-9-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$"))' "$receipt" >/dev/null || {
            echo 'Release receipt contains an image reference that is not an immutable GHCR digest' >&2
            exit 1
          }
          {
            echo '## Published image'
            printf 'image_ref=%s@%s\nsource_revision=%s\n' "$image" "$digest" "$GITHUB_SHA"
            printf 'Release receipt: `release-receipt-publish-container-%s` artifact.\n' "$GITHUB_SHA"
            if [[ -n "$PR_RUN" ]]; then
              printf 'Pull-request check run %s passed on this exact tree.\n' "$PR_RUN"
            else
              echo 'No passing pull-request check of this exact tree was found; this publisher runs no test suite.'
            fi
            echo 'Promote this digest in the owning Ops release file to deploy it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the standard release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipt-publish-container-${{ github.sha }}
          path: ${{ runner.temp }}/release-receipt/release-receipt.json
          if-no-files-found: error
          retention-days: 90
