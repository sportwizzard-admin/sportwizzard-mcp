name: Publish SportWizzard MCP image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sportwizzard-mcp-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assemble tracked source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/image-source"

      - name: Authenticate the image publisher
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable image and release identity
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY}
          cache_ref="$image:buildcache-container"
          metadata="$RUNNER_TEMP/image-metadata.json"
          docker buildx build --platform linux/amd64 \
            --cache-from "type=registry,ref=$cache_ref" \
            --cache-to "type=registry,ref=$cache_ref,mode=max,ignore-error=true" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" \
            --metadata-file "$metadata" --push "$RUNNER_TEMP/image-source"
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")"
          printf 'image_ref=%s@%s\nsource_revision=%s\n' "$image" "$digest" "$GITHUB_SHA" > "$RUNNER_TEMP/image-release.txt"
          {
            echo '## Published image'
            cat "$RUNNER_TEMP/image-release.txt"
            echo 'Promote this digest in the owning Ops release file to deploy it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the immutable publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-release
          path: ${{ runner.temp }}/image-release.txt
          retention-days: 90
