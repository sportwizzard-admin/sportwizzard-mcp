name: PR check
run-name: "PR #${{ github.event.pull_request.number }} check (merge ${{ github.sha }})"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find the changed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - name: Check out the pull-request test merge and its base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      # The test merge's first parent is the tip of main, so this lists exactly
      # what merging the pull request would change (--no-renames keeps the old
      # path of a moved file). A skipped job counts as passed, so the run still
      # reports success.
      - name: Compare the test merge with main
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
          image=false
          while IFS= read -r -d '' path; do
            # Everything the image build reads, plus CI files. publish-container.yml
            # lists the same image inputs but only its own CI files.
            case "$path" in
              Dockerfile|.dockerignore|package.json|package-lock.json|tsconfig.json|src/*|.github/*) image=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          printf 'image=%s\n' "$image" | tee -a "$GITHUB_OUTPUT"
          {
            printf '## Changed inputs\nImage build: %s.\n\n```\n' "$image"
            tr '\0' '\n' < "$RUNNER_TEMP/changed-files"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build, pack and stdio-smoke the package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull-request test merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check package, lock and registry metadata agree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const lock = JSON.parse(readFileSync('package-lock.json'));
          const registry = JSON.parse(readFileSync('server.json'));
          assert.equal(pkg.name, 'sportwizzard-mcp');
          assert.equal(pkg.repository.url, 'git+https://github.com/sportwizzard/sportwizzard-mcp.git');
          assert.match(pkg.version, /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(registry.version, pkg.version);
          assert.equal(registry.packages.find(p => p.registryType === 'npm').version, pkg.version);
          JS

      - name: Install dependencies and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Pack, install in a disposable consumer and run the mock stdio smoke
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/npm-release"
          mkdir -p "$release"
          npm pack --ignore-scripts --pack-destination "$release"
          mv "$release"/*.tgz "$release/package.tgz"
          npm install --prefix "$RUNNER_TEMP/npm-consumer" --omit=dev --ignore-scripts --no-audit --no-fund "$release/package.tgz"
          npm run smoke -- "$RUNNER_TEMP/npm-consumer/node_modules/sportwizzard-mcp/dist/index.js" "$release/smoke.json" "$release/package.tgz"

      # The container runs dist/httpServer.js on Node 20 with the locked
      # runtime dependencies (npm ci --omit=dev), so this smoke does the same.
      - name: Use the image's Node.js major version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Start the hosted HTTP entry point against the mock API
        shell: bash
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/http-consumer"
          mkdir -p "$server"
          tar -xzf "$RUNNER_TEMP/npm-release/package.tgz" -C "$server" --strip-components=1
          cp package-lock.json "$server/"
          npm ci --prefix "$server" --omit=dev --ignore-scripts --no-audit --no-fund
          npm run smoke:http -- "$server/dist/httpServer.js" "$RUNNER_TEMP/npm-release/http-smoke.json"

  image:
    name: Build the container image without pushing
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the pull-request test merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up BuildKit on the GitHub-hosted runner
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Assemble tracked source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/image-source"

      - name: Build the publisher's image (no push)
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --builder "$BUILDER_NAME" --platform linux/amd64 \
            --output type=cacheonly "$RUNNER_TEMP/image-source"
