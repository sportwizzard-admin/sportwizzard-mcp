name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-sportwizzard-mcp
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        # Keep the job's npm out of the setup-node tool cache.
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$prefix" npm@11.15.0 --ignore-scripts
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Validate package and unused version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          repository_url="$(node -p "require('./package.json').repository.url")"
          [[ "$package_name" == "sportwizzard-mcp" ]] || { echo 'Unexpected package name' >&2; exit 1; }
          [[ "$repository_url" == "git+https://github.com/sportwizzard/sportwizzard-mcp.git" ]] || { echo 'Unexpected npm repository URL' >&2; exit 1; }
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version' >&2; exit 1; }
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const lock = JSON.parse(readFileSync('package-lock.json'));
          const registry = JSON.parse(readFileSync('server.json'));
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(registry.version, pkg.version);
          assert.equal(registry.packages.find(p => p.registryType === 'npm').version, pkg.version);
          JS
          error_file="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>"$error_file"; then
            echo "${package_name}@${package_version} already exists on npm" >&2
            exit 1
          else
            result=$?
            if ! grep -Eq 'E404|ETARGET' "$error_file"; then
              cat "$error_file" >&2
              exit "$result"
            fi
          fi
          printf 'Preparing %s@%s from %s\n' "$package_name" "$package_version" "$GITHUB_SHA"

      - name: Install dependencies and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Pack the release once
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
          mv "$RUNNER_TEMP"/npm-release/*.tgz "$RUNNER_TEMP/npm-release/package.tgz"
          printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/npm-release/package.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Verify installed tarball through mock stdio MCP
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/npm-consumer" --omit=dev --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-release/package.tgz"
          npm run smoke -- "$RUNNER_TEMP/npm-consumer/node_modules/sportwizzard-mcp/dist/index.js" "$RUNNER_TEMP/npm-release/smoke.json" "$RUNNER_TEMP/npm-release/package.tgz"

      - name: Retain the verified package and smoke receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the publishing CLI without lifecycle scripts
        # Keep the job's npm out of the setup-node tool cache.
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$prefix" npm@11.15.0 --ignore-scripts
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Download this run's verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/npm-release

      - name: Verify package bytes and publish without lifecycle scripts
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        working-directory: ${{ runner.temp }}/npm-release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  package.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          npm publish ./package.tgz --ignore-scripts
